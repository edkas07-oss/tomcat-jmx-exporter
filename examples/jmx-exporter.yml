# Interface example only. Production metric rules are owned by the consuming
# monitoring repository and should be mounted at this same runtime path.
---
httpServer:
  ssl:
    keyStore:
      filename: /run/secrets/tomcat-jmx-exporter/keystore.p12
      type: PKCS12
      password: ${JMX_EXPORTER_KEYSTORE_PASSWORD}
    certificate:
      alias: tomcat-jmx-exporter
rules:
  - pattern: 'java.lang<type=Memory><HeapMemoryUsage>used: (.+)'
    name: jvm_memory_heap_used_bytes
    value: "$1"
    type: GAUGE
  - pattern: 'Catalina<type=Server><>serverInfo: (.+)'
    name: tomcat_server_info
    value: 1
    labels:
      version: "$1"
    type: GAUGE

